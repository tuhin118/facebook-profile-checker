<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>FB PROFILE // CHECKER</title>  <link rel="stylesheet" href="style.css">
</head><body>  <main class="container"><header>
  <div class="logo">◈ FB PROFILE // SYSTEM</div>

  <h1>PROFILE CHECKER</h1>

  <p class="subtitle">
    Facebook profile information lookup
  </p>
</header>

<section class="panel">

  <label for="searchInput">
    EMAIL OR PHONE NUMBER
  </label>

  <div class="input-wrap">

    <input
      id="searchInput"
      type="text"
      placeholder="Enter email or phone number..."
      autocomplete="off"
    >

    <button id="checkBtn">
      CHECK
    </button>

  </div>

  <div id="status" class="status">
    Waiting for input...
  </div>

  <div id="result" class="result">

    <div class="profile">

      <div class="avatar-wrap">

        <img
          id="avatar"
          class="avatar"
          src=""
          alt="Profile"
        >

        <span
          id="avatarBadge"
          class="badge"
        ></span>

      </div>

      <div class="info">

        <h2 id="profileName">
          Unknown Profile
        </h2>

        <p>
          Facebook UID:
          <span id="profileId">—</span>
        </p>

        <p>
          Linked Accounts:
          <span id="instagram">—</span>
        </p>

        <a
          id="profileLink"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="profile-link"
        >
          Open Facebook Profile
        </a>

      </div>

    </div>

    <div class="details">

      <div class="detail-card">
        <span class="detail-label">ACCOUNT STATUS</span>
        <strong id="accountStatus">UNKNOWN</strong>
      </div>

      <div class="detail-card custom-avatar-card">

        <span class="detail-label">CUSTOM AVATAR</span>

        <img
          id="customAvatar"
          class="custom-avatar"
          src=""
          alt="Custom Avatar"
        >

      </div>

      <div class="detail-card">

        <span class="detail-label">NOTE</span>

        <strong id="profileNote">—</strong>

      </div>

    </div>

  </div>

</section>

<footer class="footer">
  FB PROFILE CHECKER // PUBLIC INFORMATION ONLY
</footer>

  </main>  <script src="app.js"></script></body>
</html>
